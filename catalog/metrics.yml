# Metrikkatalogen. Seks felt. Fylles ut for hånd.
# `caveats` og `breaks` er de to som betyr noe — de er forskjellen på en
# tallpakke en journalist kan forsvare og en de ikke kan.

kraftpris_nominell:
  label: Kraftpris, nominell
  model: mart.kraftpris_maaned
  column: ore_nominell
  unit: øre/kWh
  source: SYNTETISK — generert av statman.sources.synthetic, ikke ekte statistikk
  caveats:
    - Nominelle kroner. Kan ikke sammenlignes over tid uten deflatering.
    - Spotpris uten nettleie, avgifter og strømstøtte. Ikke det folk betaler.
  breaks: []

kraftpris_realt:
  label: Kraftpris i faste kroner
  model: mart.kraftpris_maaned
  column: ore_faste_kroner
  unit: øre/kWh, faste kroner (siste måned i serien)
  source: SYNTETISK — generert av statman.sources.synthetic, ikke ekte statistikk
  caveats:
    - Deflatert med totalindeks KPI. Merk at kraft selv inngår i KPI, så
      deflatering med totalindeks demper utslaget noe.
    - Referansemåned er siste måned i serien, så hele serien flytter seg når
      nye måneder kommer til. Oppgi alltid referansemåned i grafteksten.
  breaks: []

kraftpris_endring_12m:
  label: Kraftpris, 12-måneders realendring
  model: mart.kraftpris_maaned
  column: endring_12m_realt
  unit: andel (0.031 = 3,1 %)
  source: SYNTETISK — generert av statman.sources.synthetic, ikke ekte statistikk
  caveats:
    - Null for de tolv første månedene i serien.
    - Basiseffekt — store utslag i 2023 skyldes hovedsakelig nivået i 2022,
      ikke prisen i 2023. Kommenter alltid nivå sammen med endring.
  breaks: []

# --------------------------------------------------------------------------
# Befolkning. Ekte tall fra SSB, 2011–2025.
# --------------------------------------------------------------------------

folkemengde:
  label: Folkemengde i kommunen
  model: mart.befolkning_kommune_aar
  column: folkemengde
  unit: personer
  source: SSB tabell 06913, kodeliste agg_KommSummerHist (Kommuner 2024)
  caveats:
    - Bestand per 1. januar i året på raden. Endringstallene på samme rad
      gjelder derimot kalenderåret som følger. Folkemengde 2026 er altså
      1.1.2026, og folketilvekst 2025 er veksten som førte dit.
    - Registrerte bosatte etter Folkeregisteret. Personer med forventet
      opphold under seks måneder, og asylsøkere uten innvilget opphold, er
      ikke med. De blir talt fra den dagen de får opphold, og teller da som
      innflytting til kommunen de bor i.
    - Summen over de 357 kommunene er 53 011 lavere enn Norges folketall til
      og med 2019, og stemmer fra 2020. Differansen er historikken til
      kommuner som ble delt i 2020, som SSB ikke tilordner noen kommune i
      dagens inndeling. Bruk mart.befolkning_fylke_aar til lands- og
      fylkestall.
  breaks:
    - Fem kommuner har folkemengde 0 før 2020 fordi de ble dannet av
      kommuner som ble delt — Narvik og Hábmer-Hamarøy (Tysfjord), Heim,
      Hitra og Orkland (Snillfjord). Det er ikke befolkning som mangler,
      det er en inndeling som ikke fantes. Kolonnen aar_uten_folketall
      teller årene.
    - 1.1.2024 ble Ålesund delt i Ålesund (1508) og Haram (1580). Haram var
      egen kommune også til og med 2019, sto med 0 innbyggere 2020–2023 mens
      den var en del av Ålesund, og er tilbake fra 2024. Serien er brutt to
      ganger og kan ikke brukes uten å håndtere begge.
    - Grensejusteringer i 2017 (Stokke delt mellom Tønsberg og Sandefjord),
      2019, 2020, 2022, 2024 og 2026. Alle er merket i kolonnen grenseavvik.

folkevekst_pst:
  label: Befolkningsvekst over perioden
  model: mart.befolkningsvekst
  column: vekst_pst
  unit: andel (0.144 = 14,4 %)
  source: SSB tabell 06913, kodeliste agg_KommSummerHist (Kommuner 2024)
  caveats:
    - Måler 1.1.2011 mot 1.1.2026, altså veksten gjennom kalenderårene
      2011–2025. Periodens lengde står i kolonnene aar_start og aar_slutt,
      ikke i navnet på metrikken.
    - Gjelder bare kommuner med sammenlignbar = true. 34 av 357 kommuner
      byttet grenser eller mangler historikk, og har rangering = null.
      Prosenten deres måler grenseendringen, ikke befolkningsutviklingen.
    - Sammenlignbar krever at det største enkeltavviket er under 0,5 prosent
      av folketallet, ikke at det er null. Terskelen er en vurdering. De
      faktiske avvikene ligger i grenseavvik_sum og grenseavvik_maks_pst, så
      en strengere eller løsere grense kan settes uten å bygge om noe.
    - Prosentvekst er ustabil i små kommuner. En kommune med 500 innbyggere
      flytter seg 10 prosent på 50 personer. Oppgi alltid folkemengden
      sammen med prosenten.
    - Enkeltinstitusjoner slår gjennom. Råde vokste 9 prosent i 2022 og falt
      5 prosent i 2023 fordi ankomstsenteret der ble fylt og tømt. Slike
      utslag er ekte registrerte bosatte, men de er ikke det folk leser inn
      i «befolkningsvekst».
  breaks: []

folkevekst:
  label: Befolkningsvekst over perioden, antall
  model: mart.befolkningsvekst
  column: vekst
  unit: personer
  source: SSB tabell 06913, kodeliste agg_KommSummerHist (Kommuner 2024)
  caveats:
    - Differansen mellom to bestandstall, ikke summen av endringene. For
      kommuner med grenseavvik er de to ikke like — det er nettopp det
      grenseavvik måler, og identiteten
      vekst = folketilvekst_sum + grenseavvik_sum er en sjekk på modellen.
  breaks: []

fodselsoverskudd_sum:
  label: Fødselsoverskudd, sum over perioden
  model: mart.befolkningsvekst
  column: fodselsoverskudd_sum
  unit: personer
  source: SSB tabell 06913, kodeliste agg_KommSummerHist (Kommuner 2024)
  caveats:
    - Levendefødte minus døde blant registrerte bosatte i kommunen.
    - Negativt i 200 av 323 sammenlignbare kommuner i 2011–2025. Det er
      normaltilstanden i norske kommuner, ikke et avvik som skal forklares.
  breaks: []

nettoinnflytting_sum:
  label: Nettoinnflytting, sum over perioden
  model: mart.befolkningsvekst
  column: nettoinnflytting_sum
  unit: personer
  source: SSB tabell 06913, kodeliste agg_KommSummerHist (Kommuner 2024)
  caveats:
    - Flytting mellom norske kommuner teller likt med inn- og utvandring.
      Summen over alle kommuner er derfor ikke nettoinnvandringen til Norge,
      og en kommunes tall sier ingenting om hvor folk kom fra.
    - Fødselsoverskudd pluss nettoinnflytting er ikke alltid nøyaktig lik
      folketilveksten. Restleddet er lite — 1 person i median per kommuneår,
      267 på det meste — og ligger i kolonnen restledd i stedet for å bli
      fordelt på komponentene.
  breaks: []

# --------------------------------------------------------------------------
# Preben mot borgerlig oppslutning. Underholdning med ekte tall, ikke
# vitenskap — se caveats. 15 valgår, hvorav 2 faller bort, er ikke et
# datagrunnlag noen konklusjon bør hvile tungt på.
# --------------------------------------------------------------------------

navn_preben_andel:
  label: Andel nyfødte gutter som heter Preben
  model: mart.navn_preben_aar
  column: andel_fodte_pst
  unit: prosent av nyfødte gutter det året
  source: SSB tabell 10467, «Fødte, etter jentenavn og guttenavn»
  caveats:
    - Tall under fire personer er ikke oppgitt av personvernhensyn, og vises
      som manglende, ikke som null. Det gjelder flere av de siste årene, der
      Preben er blitt sjeldent.
    - Måler fødselsår til og med 2020 og navngivningsår fra og med 2021 —
      SSB byttet metode det året. De to er ikke identiske; et barn kan
      navngis året etter det er født.
    - Navngivningsår har et etterslep. 2023-2025 er derfor enten undertrykt
      eller ikke ferdig talt opp i denne hentingen — se aarets status i
      mart.navn_preben_aar før du bruker de siste årene til noe.
    - Navnemoter drives av alt fra kongehus til TV-serier til at navnet ble
      vanlig nok forrige generasjon til å virke gammeldags neste. Politisk
      klima er én av svært mange mulige forklaringer, ikke den opplagte.
  breaks: []

velgere_borgerlig_andel:
  label: Borgerlig oppslutning (H, FrP, KrF, V), valgår
  model: mart.velgere_borgerlig
  column: borgerlig_andel_pst
  unit: prosent av velgerne
  source: SSB tabell 09624, «Stortingsvalget. Velgere, etter politisk parti og kjønn»
  caveats:
    - Selvrapportert stemmegivning fra SSBs valgundersøkelse, ikke opptalte
      valgresultater. Den følger de faktiske resultatene tett, men er ikke
      identisk med dem.
    - "«Borgerlig» er her Høyre + Fremskrittspartiet + Kristelig Folkeparti
      + Venstre. Senterpartiet er holdt utenfor — se
      statman/models/mart_navn_politikk.py for begrunnelsen. Et annet
      partiutvalg gir et annet tall."
    - Bare stortingsvalgår, altså hvert fjerde år. 1969 mangler
      Fremskrittspartiet, som ikke fantes ennå, og har derfor ingen
      blokksum i dette datasettet.
    - Femten valgår er et lite datagrunnlag for enhver korrelasjon. Se
      metodeavsnittet i sakspakken for hvor lite.
  breaks: []

# --------------------------------------------------------------------------
# Preben mot meningsmålinger. Samme spørsmål som over, men årlig i stedet
# for hvert fjerde år, og på endring i stedet for nivå — se
# statman/models/mart_meningsmaling_politikk.py for hvorfor nivå alene er
# en felle når begge seriene beveger seg i lange buer.
# --------------------------------------------------------------------------

meningsmaling_borgerlig_andel:
  label: Borgerlig oppslutning (H, FrP, KrF, V), årssnitt av meningsmålinger
  model: mart.velgere_borgerlig_meningsmaling
  column: borgerlig_andel_pst
  unit: prosent av velgerne, snitt av tolv månedlige målinger
  source: pollofpolls.no, «Gjennomsnitt av nasjonale meningsmålinger om stortingsvalg»
  caveats:
    - "Ikke offisiell statistikk: et redaksjonelt beregnet snitt av
      publiserte meningsmålinger, ikke et opptalt resultat og ikke en
      enkeltmåling. Metoden er tredjepartens egen og kan ikke etterprøves
      fra utsiden."
    - "Årssnittet er vårt eget, ikke hentet ferdig fra kilden: gjennomsnitt
      av de tolv månedlige snittene i kalenderåret. Et år med færre enn
      tolv måneder — i praksis bare inneværende år før det er omme — er
      utelatt i stedet for å vises som et ufullstendig gjennomsnitt."
    - "«Borgerlig» er samme fire partier som i velgere_borgerlig_andel:
      Høyre + Fremskrittspartiet + Kristelig Folkeparti + Venstre."
    - Dekker 2008 og framover — det er der kildens egen månedlige serie
      begynner, ikke en grense vi har satt.
    - "Meningsmålinger svinger av grunner som ikke har noe med navnemoter å
      gjøre: enkeltsaker, statsministerkandidater, partilederbytter."
  breaks: []

meningsmaling_borgerlig_endring:
  label: Endring i borgerlig oppslutning fra året før
  model: mart.preben_trend
  column: delta_borgerlig_pst
  unit: prosentpoeng fra året før
  source: pollofpolls.no, «Gjennomsnitt av nasjonale meningsmålinger om stortingsvalg»
  caveats:
    - Regnet ut for å fjerne den lange, langsomme trenden i nivåtallet før
      det sammenlignes med noe annet. To serier som begge glir samme vei
      over mange år vil korrelere på nivå uansett hva de måler; endringen
      år for år er en strengere test.
    - "Null med mindre både året og året før har et årssnitt basert på
      tolv måneder, og året før faktisk *er* året før — ikke bare forrige
      rad i tabellen. Et hull hopper aldri over seg selv og blir lest som
      ett års endring."
  breaks: []

navn_preben_endring:
  label: Endring i andel Preben-fødsler fra året før
  model: mart.preben_trend
  column: delta_andel_fodte_preben_pst
  unit: prosentpoeng fra året før
  source: SSB tabell 10467, «Fødte, etter jentenavn og guttenavn»
  caveats:
    - "Samme grunn som for meningsmaling_borgerlig_endring: fjerner den
      lange trenden i Preben-andelen, som har falt mesteparten av
      perioden 2008-2025, før den sammenlignes med noe annet."
    - "Null med mindre både året og året før har et Preben-tall, og året
      før faktisk er året før. Preben-tallet mangler for flere år etter
      2017 — se navn_preben_andel — så endringer over disse hullene
      regnes ikke ut, ikke engang som en flerårig endring."
  breaks: []

# --------------------------------------------------------------------------
# Styringsrenten mot boligprisene. Nivåkorrelasjonen over hele perioden er
# drevet av at begge serier har beveget seg i tiår-lange buer siden 1992 —
# se mart_rente_bolig.py. Endringstallet er strengere: hvor mye endrer
# boligprisveksten seg etter at renta faktisk endres.
# --------------------------------------------------------------------------

styringsrente:
  label: Styringsrenten, kvartalssnitt
  model: mart.rente_bolig_kvartal
  column: rente_snitt_pst
  unit: prosent p.a., snitt av virkedagsnoteringer i kvartalet
  source: Norges Bank, dataserie IR/B.KPRA.SD (styringsrenten)
  caveats:
    - Kvartalssnitt av virkedagsnoteringer ved dagens slutt, ikke et snitt
      av kalenderdager. Renten er identisk hver dag mellom rentemøtene, så
      snittet flytter seg bare når Norges Bank faktisk endrer den.
    - Styringsrenten er ikke en variabel som beveger seg uavhengig av
      boligmarkedet den sammenlignes med her. Norges Bank setter renten
      blant annet ut fra egne vurderinger av presset i boligmarkedet, så en
      sammenheng kan gå begge veier.
  breaks: []

boligprisindeks:
  label: Prisindeks for brukte boliger, hele landet
  model: mart.rente_bolig_kvartal
  column: boligindeks
  unit: indeks, 2015=100
  source: SSB tabell 07221, «Prisindeks for brukte boliger, etter boligtype og region»
  caveats:
    - Landsgjennomsnitt for alle boligtyper samlet. Skjuler betydelige
      regionale forskjeller — samme tabell hos SSB har indeksen brutt ned på
      elleve regioner, som denne saken ikke bruker.
    - Ikke sesongjustert. Brukes bare til nivåbildet over hele perioden
      1992-2026; endringstallet under bruker den sesongjusterte varianten,
      som ikke finnes like langt tilbake.
  breaks: []

boligprisindeks_sesongjustert:
  label: Prisindeks for brukte boliger, sesongjustert
  model: mart.rente_bolig_kvartal
  column: boligindeks_sesjustert
  unit: indeks, 2015=100, sesongjustert
  source: SSB tabell 07221, «Prisindeks for brukte boliger, etter boligtype og region»
  caveats:
    - Finnes bare fra 2005K1, elleve år kortere enn styringsrenteserien.
      Endringsanalysen dekker derfor 2005-2026, ikke hele perioden
      nivåtallet viser.
    - SSBs egen sesongjustering, ikke etterprøvd eller regnet om av oss.
  breaks: []

styringsrente_endring_kvartal:
  label: Endring i styringsrenten fra forrige kvartal
  model: mart.rente_bolig_kvartal
  column: delta_rente_pp
  unit: prosentpoeng fra forrige kvartal
  source: Norges Bank, dataserie IR/B.KPRA.SD (styringsrenten)
  caveats:
    - Null med mindre forrige rad faktisk er forrige kvartal, ikke bare
      forrige rad i tabellen — se navn_preben_endring for samme prinsipp.
      Det finnes ikke noe hull i denne serien i dag, men sjekken er der.
  breaks: []

boligprisvekst_kvartal:
  label: Boligprisvekst fra forrige kvartal, sesongjustert
  model: mart.rente_bolig_kvartal
  column: endring_bolig_kvartal_pst
  unit: andel (0.014 = 1,4 %) fra forrige kvartal
  source: SSB tabell 07221, «Prisindeks for brukte boliger, etter boligtype og region»
  caveats:
    - Regnet ut av oss fra den sesongjusterte indeksen, ikke hentet ferdig.
    - Sammenlignes i denne saken med endringen i styringsrenten ett eller
      flere kvartal tidligere, ikke samme kvartal — se «Metode» i
      sakspakken for hvorfor, og «Følsomhet» for hvor mye valget av
      forskyvning betyr.
  breaks: []

# --------------------------------------------------------------------------
# Drikkevannskvalitet i Farrisvannet. Vestfold Vann IKS' eget
# overvåkingsprogram via Vannmiljø — se statman/models/clean_vannmiljo.py
# for hvilke av de 16 «Farris»-vannlokalitetene som faktisk brukes og
# hvorfor. Rene tidsutviklinger, ingen sammenhenger regnet ut mellom dem.
# --------------------------------------------------------------------------

farris_fargetall:
  label: Vannfarge (fargetall), Farris ved Bakkepollen
  model: mart.farris_vannkvalitet_dato
  column: fargetall_mg_pt_l
  unit: mg Pt/l, øverste meter
  source: Miljødirektoratet, Vannmiljø — Vestfold Vann IKS' overvåking av drikkevannskilden Farris
  caveats:
    - Kun øverste meter (1 m) av et fullt dypprofil ned til 60 m som tas ved
      hver prøve. Dypere sjikt er jevnt lavere i fargetall og ligger urørt
      i clean.vannmiljo_farris for den som vil se resten av profilen.
    - Prøver tas bare april-november — innsjøen er ikke overvåket på denne
      måten om vinteren. Linjer som krysser årsskiftet i grafene hopper
      derfor over en periode uten data, ikke en jevn utvikling.
    - Ett målepunkt (Bakkepollen) av flere i innsjøen. Ikke nødvendigvis
      representativt for hele Farris.
  breaks: []

farris_turbiditet:
  label: Turbiditet, Farris ved Bakkepollen
  model: mart.farris_vannkvalitet_dato
  column: turbiditet_fnu
  unit: FNU, øverste meter
  source: Miljødirektoratet, Vannmiljø — Vestfold Vann IKS' overvåking av drikkevannskilden Farris
  caveats:
    - Samme forbehold som farris_fargetall — øverste meter, april-november,
      ett målepunkt.
  breaks: []

farris_koliforme_bakterier:
  label: Koliforme bakterier, Farris ved Bakkepollen
  model: mart.farris_vannkvalitet_dato
  column: koliforme_bakterier_per_100ml
  unit: antall/100 ml, øverste meter
  source: Miljødirektoratet, Vannmiljø — Vestfold Vann IKS' overvåking av drikkevannskilden Farris
  caveats:
    - Dette er råvann rett fra innsjøen, ikke drikkevannet som når springen
      — det skal desinfiseres og renses etter denne prøvetakingen, ikke
      etter den.
    - Samme forbehold som farris_fargetall — øverste meter, april-november,
      ett målepunkt.
  breaks: []

farris_e_coli:
  label: E. coli, Farris ved Bakkepollen
  model: mart.farris_vannkvalitet_dato
  column: e_coli_per_100ml
  unit: antall/100 ml, øverste meter
  source: Miljødirektoratet, Vannmiljø — Vestfold Vann IKS' overvåking av drikkevannskilden Farris
  caveats:
    - Samme forbehold som farris_koliforme_bakterier — dette er råvann, ikke
      ferdig renset drikkevann.
  breaks: []

# --------------------------------------------------------------------------
# Satire: norske skatteutflyttere mot FIFA/Coca-Cola Men's World Ranking.
# Se statman/models/mart_utflyttere_fifa.py for differansedefinisjonen.
# --------------------------------------------------------------------------

utflyttere_fifa_differanse:
  label: FIFA-plassdifferanse, nytt land minus Norge
  model: mart.utflyttere_fifa
  column: differanse
  unit: plasser (positivt = nytt land bedre plassert enn Norge)
  source: FIFA/Coca-Cola Men's World Ranking, gjeldende fra 20. juli 2026 — se statman/sources/fifa.py
  caveats:
    - "Dette er satire. FIFA-rangeringen sier ingenting om hvor bra det er å
      bo et sted, og differansen her måler ingenting annet enn to tall på en
      liste samme dag."
    - "Rangeringen er et øyeblikksbilde, ikke en trend: gjeldende fra 20. juli
      2026, uendret til neste offisielle oppdatering 7. oktober 2026. En
      utflytter rangeres ikke om av kamper spilt etter det, eller av hvor
      lenge de faktisk har bodd i det nye landet."
    - "Landet er identifisert ved FIFA-medlemskap, ikke ved skattemessig
      bosted. England har egen FIFA-rangering adskilt fra resten av
      Storbritannia; det gjør ingen forskjell for den skattemessige
      vurderingen, bare for hvilket lag som telles."
    - "Firemannsutvalget er ikke en fullstendig liste over norske
      skatteutflyttere, bare fire navngitte, dokumenterte tilfeller — ett
      land per person. Se kilde_url i mart.utflyttere_fifa for hver enkelt."
  breaks: []

# --------------------------------------------------------------------------
farris_cyanobakterier_aar:
  label: Cyanobakterier (blågrønnalger), årlig maks
  model: mart.farris_algeblomst_aar
  column: cyano_maks_mg_l
  unit: mg/l biomasse, årlig maksmåling
  source: Miljødirektoratet, Vannmiljø — Vestfold Vann IKS' overvåking av Farris, to målepunkter (Eikenesfjorden og Nesfjorden)
  caveats:
    - Én måling i året (nominelt 1. august), ikke et sesongmaks funnet ved
      hyppig prøvetaking. Et faktisk maksimum midtsommers kan være høyere
      eller lavere enn denne ene prøven fanger opp.
    - Flere år mangler måling helt (blant annet 2011, 2015, 2018, 2019 ved
      Eikenesfjorden) — se hull i tidslinjen som manglende data, ikke null.
    - Ingen offisiell grenseverdi er lagt inn eller vurdert her — tallene
      vises som de er, ikke klassifisert som "høy"/"lav" risiko.
  breaks: []

# --------------------------------------------------------------------------
# Arbeidsmarkedet, yrke for yrke. SSB tabell 11658 og 14789, STYRK-08.
# Alle sju deler tre forbehold som er verdt å lese én gang: utvalget er
# lønnstakere (ikke selvstendige), grainet er fireside STYRK-08, og
# hovedgruppe 0 tåler ikke en tidsserie.
# --------------------------------------------------------------------------

yrke_lonnstakere:
  label: Lønnstakere i yrket
  model: mart.arbeidsmarked_yrke
  column: lonnstakere
  unit: personer
  source: SSB tabell 11658, siste kvartal. STYRK-08 fireside nivå.
  caveats:
    - "Lønnstakere, ikke sysselsatte. Selvstendig næringsdrivende er ikke
      med. Det treffer ikke alle yrker likt: bønder, fiskere, frisører,
      tannleger, advokater og kunstnere er systematisk underrepresentert,
      mens offentlig ansatte yrker er fullt dekket. Hovedgruppe 6 (bønder,
      fiskere mv.) står med 27 500 lønnstakere og er dermed en brøkdel av
      næringen."
    - "Én person telles i ett yrke — hovedarbeidsforholdet. Den som er
      sykepleier i 60 prosent og lærer i 40, teller bare som sykepleier."
    - "Yrkeskoden settes av arbeidsgiver i a-meldingen og kontrolleres ikke
      mot faktiske arbeidsoppgaver. Kvaliteten varierer mellom yrker, og
      «Uoppgitt» (kode 0000) er de 7 600 der den mangler helt."
    - "Kvartalstall. Antall lønnstakere svinger systematisk gjennom året, så
      to kvartaler kan bare sammenlignes med samme kvartal i et annet år."
    - "SSB endrer alle ett-tall og to-tall i tabellen til 0 eller 3 av
      personvernhensyn. Tellinger for de aller minste yrkene er altså
      forstyrret med vilje, og et yrke som står med 0 lønnstakere kan ha én
      eller to. Det påvirker ikke summene i praksis, men det er grunnen til
      at yrker under noen få titalls ansatte ikke skal leses som eksakte."
  breaks: []

yrke_vekst_pst:
  label: Endring i antall lønnstakere over ti år
  model: mart.arbeidsmarked_yrke
  column: vekst_pst
  unit: andel (0.123 = 12,3 %)
  source: SSB tabell 11658, samme kvartal ti år fra hverandre.
  caveats:
    - "Målt, ikke framskrevet. Dette er hva som faktisk skjedde mellom de to
      kvartalene, ikke en prognose for hva som skjer videre."
    - "Endring i et yrke er ikke det samme som endring i arbeidsoppgavene.
      En stilling kan bytte yrkeskode uten at noen bytter jobb, og
      arbeidsinnholdet kan endres fullstendig uten at koden flytter seg."
    - "Kolonnen sammenlignbar er false for yrker under 500 lønnstakere i en
      av endene, og for hele hovedgruppe 0. Rangeringer skal bruke den;
      tallet finnes for alle yrker, men betyr ikke det samme for alle."
  breaks:
    - "Hovedgruppe 0 kan ikke brukes over tid. Forsvaret innførte
      spesialistordningen (OR/OF) i 2016, og omkodingen alene gir «Befal med
      sersjant grad» +365 prosent og «Offiserer fra fenrik og høyere grad»
      -51 prosent. Ingen av delene er en endring i arbeidsmarkedet."
    - "«Uoppgitt» (0000) falt fra 19 600 til 7 600 fordi yrkesregistreringen
      ble bedre, ikke fordi et yrke forsvant. De 12 000 er fordelt ut på de
      andre yrkene, og trekker dermed veksten deres opp med et par tideler
      hver."
    - "SSB merker tabellen: «Fra 4. kvartal 2024 til 1. kvartal 2025 har
      kvalitetsforbedringer i innrapporteringen medført større endringer i
      tabellene med yrke […] Store endringer mellom disse periodene bør
      tolkes med forsiktighet.» Ett kvartalsskifte står for 70 000 av de
      473 000 flyttede lønnstakerne i tiårsperioden. Kolonnen
      endring_bruddkvartal har tallet for hvert yrke, så det kan sjekkes per
      yrke framfor å tas på tro. Topp- og bunnlistene endrer seg lite når
      bruddet utelates, men nivåene gjør det."

yrke_median_lonn:
  label: Median månedslønn i yrket
  model: mart.arbeidsmarked_yrke
  column: median_lonn
  unit: kroner per måned
  source: SSB tabell 11658, siste kvartal. Median over alle lønnstakere i yrket.
  caveats:
    - "Månedslønn omregnet til heltidsekvivalent, ikke utbetalt lønn.
      Deltidsansatte får lønna si skalert opp til det den ville vært i full
      stilling, så tallet sier hva yrket betaler per time — ikke hva folk i
      det faktisk har å leve av. Se yrke_avtalt_arbeidstid ved siden av."
    - "Avtalt månedslønn pluss uregelmessige tillegg og bonus. Overtid er
      ikke med. Det trekker yrker med mye overtidsbetaling ned mot det
      avtalte nivået."
    - "Median, ikke gjennomsnitt. Halvparten tjener mer, halvparten mindre;
      spredningen inni yrket vises ikke."
    - "Nominelle kroner i ett kvartal. Ikke deflatert, og ikke sammenlignet
      over tid noe sted i denne saken — nettopp derfor."
    - "46 av de 407 yrkene mangler tallet. SSB publiserer ikke median for
      yrker med for få observasjoner. I åtte kjønnsdelte celler skriver
      kilden 0; de er gjort til null i mart-laget, fordi en median på null
      kroner ikke er en lønn."
  breaks: []

yrke_kvinneandel:
  label: Kvinneandel i yrket
  model: mart.arbeidsmarked_yrke
  column: kvinneandel
  unit: andel (0.82 = 82 %)
  source: SSB tabell 11658, siste kvartal.
  caveats:
    - "Andel av lønnstakerne i yrket, ikke av årsverkene. Et yrke med mange
      kvinner i deltid får høyere kvinneandel her enn det ville fått målt i
      arbeidstimer."
    - "SSB oppgir to kjønn. Tallet er derfor kvinner delt på summen av to
      kategorier, ikke på alle mulige svar."
    - "Sju yrker har ingen lønnstakere igjen og dermed ingen kvinneandel —
      null, ikke null prosent."
  breaks: []

yrke_gjennomsnittsalder:
  label: Gjennomsnittsalder i yrket
  model: mart.arbeidsmarked_yrke
  column: gjennomsnittsalder
  unit: år
  source: SSB tabell 11658, siste kvartal.
  caveats:
    - "Gjennomsnitt, ikke median. Ett yrke kan ha samme snitt av to helt
      ulike aldersfordelinger — kolonnene under_40, fra_40_til_54 og fra_55
      viser formen."
    - "Alder i yrket i dag sier ingenting om når folk går av. Et yrke med
      høy snittalder kan være et yrke folk kommer til sent, ikke et yrke som
      er i ferd med å tømmes."
  breaks: []

yrke_sykefravaer:
  label: Legemeldt sykefravær i yrket
  model: mart.arbeidsmarked_yrke
  column: sykefravaer_pst
  unit: prosent av avtalte dagsverk
  source: SSB tabell 14789, siste år (2025). Legemeldt fravær for lønnstakere.
  caveats:
    - "Bare legemeldt fravær. Egenmeldt fravær er ikke med, og utgjør
      omtrent en femtedel av det samlede sykefraværet. Yrker med mye
      korttidsfravær ser derfor lavere ut enn de er."
    - "Ikke justert for alders- eller kjønnssammensetning. Sykefravær stiger
      med alder og er høyere blant kvinner, så et yrke med mange eldre
      kvinner har høyere fravær av grunner som ikke handler om yrket."
    - "Årstall, mens alt annet i denne tabellen er siste kvartal. Kildene
      har ikke samme frekvens, og kolonnen sykefravaer_aar sier hvilket år
      det gjelder."
    - "16 av 407 yrker mangler tallet, blant dem alle de militære."
  breaks: []

yrke_avtalt_arbeidstid:
  label: Gjennomsnittlig avtalt arbeidstid i yrket
  model: mart.arbeidsmarked_yrke
  column: avtalt_arbeidstid
  unit: timer per uke
  source: SSB tabell 11658, siste kvartal.
  caveats:
    - "Avtalt arbeidstid i hovedarbeidsforholdet, ikke faktisk arbeidet tid.
      Overtid er ikke med, og en bijobb telles ikke."
    - "Lav avtalt arbeidstid er ikke det samme som deltid av eget ønske.
      Tallet skiller ikke mellom et yrke der folk vil jobbe lite og et der
      det ikke tilbys større stillinger."
    - "Et yrke som i praksis er et verv eller en bijobb — politikere,
      idrettsdommere, aktivitetsinstruktører — havner nederst uten at det
      sier noe om hva en heltidsstilling i yrket innebærer."
  breaks: []

yrke_reallonn_vekst:
  label: Reallønnsendring i yrket over ti år
  model: mart.arbeidsmarked_yrke
  column: reallonn_vekst_pst
  unit: andel (0.053 = 5,3 %)
  source: SSB tabell 11658 (median månedslønn) deflatert med SSB tabell 14700 (KPI, totalindeks)
  caveats:
    - "Deflatert med KPI totalindeks til kroner i referansekvartalet. Hele
      serien flytter seg når SSB publiserer en ny måned og referansen blir
      et nytt kvartal — oppgi alltid referansekvartalet i figurteksten."
    - "Endring i yrkets median, ikke i lønna til en person. Et yrke der de
      eldste går av med pensjon og erstattes av nyutdannede får fallende
      median uten at noen fikk lønnskutt. Dette måler hva yrket betaler,
      ikke hva noen opplevde."
    - "KPI er én prisindeks for hele landet og alle husholdninger. Den er
      ikke en levekostnadsindeks for den enkelte, og treffer ulikt for folk
      med ulikt forbruksmønster."
    - "Målt mellom samme kvartal ti år fra hverandre. Månedslønn svinger
      gjennom året, blant annet med bonusutbetalinger, og to vilkårlige
      kvartaler ville blandet sesong med utvikling."
    - "288 av 407 yrker har tallet. Resten mangler publisert medianlønn i
      minst én av endene, eller er ikke sammenlignbare over ti år."
  breaks:
    - "Lønnsnivået i tabellen har et brudd i 1. kvartal 2020: endringer hos
      opplysningspliktige ga mer korrekt rapportering og et høyere nivå,
      sterkest i bergverk og utvinning (+0,6 prosent for gjennomsnittlig
      månedslønn, +1,2 prosent i olje- og gassutvinning). Yrker i disse
      næringene får dermed en reallønnsvekst som er noe for høy."
    - "SSB merker tabellen med at kvalitetsforbedringer i yrkesrapportering
      mellom 4. kvartal 2024 og 1. kvartal 2025 ga større endringer i
      yrkesfordelingen, og at store endringer mellom disse periodene bør
      tolkes med forsiktighet. Det treffer sammensetningen av hvert yrke, og
      dermed også medianen i det."

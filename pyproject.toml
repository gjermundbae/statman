[project]
name = "statman"
version = "0.1.0"
description = "Personlig plattform for norsk offentlig statistikk"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=17",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6",
    "matplotlib>=3.9",
]

[project.scripts]
statman = "statman.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["statman"]

[tool.pytest.ini_options]
# Gjør at `pytest` virker også uten editable install.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: krever internettilgang (kjøres med `pytest -m network`)",
]
